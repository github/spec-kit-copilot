schema_version: "1.0"

preset:
  id: "copilot-extension-hooks"
  name: "Copilot Extension Hooks"
  version: "1.0.0"
  description: "Opt-in Specify extension lifecycle-hook dispatch around either Copilot SDD baseline in Copilot skills mode."
  author: "mnriem"
  repository: "https://github.com/github/spec-kit-copilot"
  license: "MIT"

requires:
  speckit_version: "==1.2.3"

provides:
  templates:
    - type: "command"
      name: "speckit.constitution"
      file: "commands/lifecycle.md"
      description: "Wrap the selected constitution baseline with extension lifecycle hooks"
      replaces: "speckit.constitution"
      strategy: "wrap"
    - type: "command"
      name: "speckit.specify"
      file: "commands/lifecycle.md"
      description: "Wrap the selected specification baseline with extension lifecycle hooks"
      replaces: "speckit.specify"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/lifecycle.md"
      description: "Wrap the selected clarification baseline with extension lifecycle hooks"
      replaces: "speckit.clarify"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/lifecycle.md"
      description: "Wrap the selected planning baseline with extension lifecycle hooks"
      replaces: "speckit.plan"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/lifecycle.md"
      description: "Wrap the selected task-generation baseline with extension lifecycle hooks"
      replaces: "speckit.tasks"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/lifecycle.md"
      description: "Wrap the selected analysis baseline with extension lifecycle hooks"
      replaces: "speckit.analyze"
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/lifecycle.md"
      description: "Wrap the selected checklist baseline with extension lifecycle hooks"
      replaces: "speckit.checklist"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/lifecycle.md"
      description: "Wrap the selected implementation baseline with extension lifecycle hooks"
      replaces: "speckit.implement"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/lifecycle.md"
      description: "Wrap the selected convergence baseline with extension lifecycle hooks"
      replaces: "speckit.converge"
      strategy: "wrap"

tags:
  - "copilot"
  - "extension-hooks"
  - "sdd"
