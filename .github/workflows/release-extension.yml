name: Release Extension

# Pushing a `<extension-id>-vX.Y.Z` tag builds that extension's zip inline and publishes it
# as a release asset — matching the `download_url` entries in
# spec-kit-extensions/catalog.json.

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract extension id (everything before the last -vX.Y.Z)
          EXTENSION_ID="${TAG%-v*}"
          VERSION="${TAG#*-v}"

          # Validate version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'" >&2
            exit 1
          fi

          # Validate extension directory exists
          if [[ ! -d "spec-kit-extensions/$EXTENSION_ID" ]]; then
            echo "Error: Extension directory 'spec-kit-extensions/$EXTENSION_ID' not found" >&2
            exit 1
          fi

          # Validate extension.yml exists
          if [[ ! -f "spec-kit-extensions/$EXTENSION_ID/extension.yml" ]]; then
            echo "Error: spec-kit-extensions/$EXTENSION_ID/extension.yml not found" >&2
            exit 1
          fi

          # Ensure the tag version matches the manifest and the catalog entry,
          # so a typo or direct tag push can't publish a mislabeled archive.
          MANIFEST_VERSION=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('spec-kit-extensions/$EXTENSION_ID/extension.yml'))['extension']['version'])")
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "Error: tag version '$VERSION' != extension.yml version '$MANIFEST_VERSION'" >&2
            exit 1
          fi

          CATALOG_VERSION=$(python3 -c "import json,sys; print(json.load(open('spec-kit-extensions/catalog.json'))['extensions']['$EXTENSION_ID']['version'])")
          if [[ "$CATALOG_VERSION" != "$VERSION" ]]; then
            echo "Error: tag version '$VERSION' != catalog.json version '$CATALOG_VERSION' for '$EXTENSION_ID'" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "extension_id=$EXTENSION_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $EXTENSION_ID v$VERSION"

      - name: Create extension zip
        run: |
          cd "spec-kit-extensions/${{ steps.parse.outputs.extension_id }}"
          zip -r "$GITHUB_WORKSPACE/${{ steps.parse.outputs.extension_id }}.zip" . \
            -x '.*' '__pycache__/*'

      - name: Generate release notes
        id: notes
        run: |
          EXTENSION_ID="${{ steps.parse.outputs.extension_id }}"
          VERSION="${{ steps.parse.outputs.version }}"
          CHANGELOG="spec-kit-extensions/$EXTENSION_ID/CHANGELOG.md"

          {
            echo 'body<<EOF'
            if [[ -f "$CHANGELOG" ]]; then
              # Extract the section for this version from CHANGELOG.md
              awk -v ver="$VERSION" '
                /^## \[/ {
                  if (found) exit
                  if (index($0, ver)) found=1
                }
                found { print }
              ' "$CHANGELOG"
            else
              echo "Release $EXTENSION_ID v$VERSION"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTENSION_ID="${{ steps.parse.outputs.extension_id }}"
          TAG="${{ steps.parse.outputs.tag }}"
          VERSION="${{ steps.parse.outputs.version }}"

          gh release create "$TAG" \
            "$EXTENSION_ID.zip" \
            --title "$EXTENSION_ID v$VERSION" \
            --notes "${{ steps.notes.outputs.body }}"
