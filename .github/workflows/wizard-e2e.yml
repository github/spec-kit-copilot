name: Wizard E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Wizard changes
    runs-on: ubuntu-latest
    outputs:
      wizard: ${{ steps.detect.outputs.wizard }}
    steps:
      - name: Detect changed Wizard files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -Eq '^(plugins/spec-kit-copilot-wizard/|tests/e2e/|tests/fixtures/specify/|tests/fixtures/test-presets/|spec-kit-extensions/|spec-kit-presets/|\.github/workflows/wizard-e2e\.yml$)' <<< "$files"; then
            echo "wizard=true" >> "$GITHUB_OUTPUT"
          else
            echo "wizard=false" >> "$GITHUB_OUTPUT"
          fi

  browser:
    name: Wizard browser tests
    needs: changes
    if: needs.changes.outputs.wizard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/spec-kit-copilot-wizard/extensions/speckit-wizard-canvas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/spec-kit-copilot-wizard/extensions/speckit-wizard-canvas/package-lock.json
      - run: npm ci
      - name: Install Designer provider dependencies
        run: npm ci
        working-directory: plugins/spec-kit-copilot-wizard/extensions/speckit-canvas-designer
      - uses: astral-sh/setup-uv@v6
      - name: Install Specify CLI
        run: |
          uv tool install specify-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/specify" --version
      - name: Test Canvas Design package contracts
        working-directory: .
        run: |
          python -m pip install -r spec-kit-extensions/tests/requirements.txt
          python -m unittest discover -s spec-kit-extensions/tests -v
      - name: Test Wizard Designer handoff
        run: node --test ./test/designer-launch.test.mjs
      - name: Test generated canvas and Designer provider
        working-directory: .
        run: node --test spec-kit-extensions/tests/*.test.mjs plugins/spec-kit-copilot-wizard/extensions/speckit-canvas-designer/test/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: wizard-e2e-results
          path: plugins/spec-kit-copilot-wizard/extensions/speckit-wizard-canvas/test-results/
          retention-days: 7

  gate:
    name: Wizard E2E gate
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check browser result for Wizard changes
        env:
          DETECTION: ${{ needs.changes.result }}
          WIZARD: ${{ needs.changes.outputs.wizard }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          if [[ "$DETECTION" != "success" ]]; then
            echo "::error::Could not determine whether Wizard files changed"
            exit 1
          fi
          if [[ "$WIZARD" == "true" && "$BROWSER" != "success" ]]; then
            echo "::error::Wizard browser tests did not pass ($BROWSER)"
            exit 1
          fi
          echo "Wizard E2E check complete (changed: $WIZARD)"
