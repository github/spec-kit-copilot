schema_version: "1.0"

preset:
  id: "copilot-full-sdd"
  name: "Copilot Full SDD"
  version: "1.0.0"
  description: "Copilot skills-mode Full SDD baseline: nine core commands, traditional artifacts and quality gates, without embedded extension lifecycle-hook dispatch."
  author: "mnriem"
  repository: "https://github.com/github/spec-kit-copilot"
  license: "MIT"

requires:
  speckit_version: "==1.2.3"

provides:
  templates:
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Template-resolved constitution with governance validation"
      replaces: "speckit.constitution"
      strategy: "replace"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Full specification with built-in spec quality checklist"
      replaces: "speckit.specify"
      strategy: "replace"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Interactive specification clarification and checklist revalidation"
      replaces: "speckit.clarify"
      strategy: "replace"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Research and design artifacts with constitution gates"
      replaces: "speckit.plan"
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Template-based dependency-ordered tasks grouped by user story"
      replaces: "speckit.tasks"
      strategy: "replace"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Read-only cross-artifact analysis with constitution authority"
      replaces: "speckit.analyze"
      strategy: "replace"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Reviewer-owned requirements-quality checklists"
      replaces: "speckit.checklist"
      strategy: "replace"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Checklist-gated implementation with dependency and validation rules"
      replaces: "speckit.implement"
      strategy: "replace"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Append-only traceable remediation of remaining implementation gaps"
      replaces: "speckit.converge"
      strategy: "replace"

tags:
  - "copilot"
  - "full"
  - "sdd"
  - "baseline"
