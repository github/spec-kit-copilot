schema_version: "1.0"

preset:
  id: "copilot-lean-sdd"
  name: "Copilot Lean SDD"
  version: "1.0.0"
  description: "Copilot skills-mode Lean SDD baseline: nine self-contained core commands, minimal artifacts, and no embedded extension lifecycle-hook dispatch."
  author: "mnriem"
  repository: "https://github.com/github/spec-kit-copilot"
  license: "MIT"

requires:
  speckit_version: ">=1.0.8"

provides:
  templates:
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Lean project constitution with governance-only scope"
      replaces: "speckit.constitution"
      strategy: "replace"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Lean feature specification and explicit feature directory"
      replaces: "speckit.specify"
      strategy: "replace"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Optional interactive clarification of a Lean specification"
      replaces: "speckit.clarify"
      strategy: "replace"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Lean single-file implementation plan"
      replaces: "speckit.plan"
      strategy: "replace"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Lean dependency-ordered implementation tasks"
      replaces: "speckit.tasks"
      strategy: "replace"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Optional read-only cross-artifact quality analysis"
      replaces: "speckit.analyze"
      strategy: "replace"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Optional reviewer-owned requirements-quality checklist"
      replaces: "speckit.checklist"
      strategy: "replace"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Execute Lean tasks and validate against the specification"
      replaces: "speckit.implement"
      strategy: "replace"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Append traceable remaining work without rewriting existing artifacts"
      replaces: "speckit.converge"
      strategy: "replace"
tags:
  - "copilot"
  - "lean"
  - "sdd"
  - "baseline"
